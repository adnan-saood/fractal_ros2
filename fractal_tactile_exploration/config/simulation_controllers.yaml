controller_manager:
  ros__parameters:
    update_rate: 250
    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

panda_arm_controller:
  ros__parameters:
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    gains:
      panda_joint1: {p: 24.0, d: 2.0, i: 0.0, i_clamp: 1.0, ff_velocity_scale: 1.0}
      panda_joint2: {p: 24.0, d: 2.0, i: 0.0, i_clamp: 1.0, ff_velocity_scale: 1.0}
      panda_joint3: {p: 24.0, d: 2.0, i: 0.0, i_clamp: 1.0, ff_velocity_scale: 1.0}
      panda_joint4: {p: 24.0, d: 1.0, i: 0.0, i_clamp: 1.0, ff_velocity_scale: 1.0}
      panda_joint5: {p: 10.0, d: 1.0, i: 0.0, i_clamp: 1.0, ff_velocity_scale: 1.0}
      panda_joint6: {p: 6.0, d: 1.0, i: 0.0, i_clamp: 1.0, ff_velocity_scale: 1.0}
      panda_joint7: {p: 2.0, d: 0.5, i: 0.0, i_clamp: 1.0, ff_velocity_scale: 1.0}
